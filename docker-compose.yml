services:
  erigon:
    build:
      context: .
      dockerfile: Dockerfile.erigon
    networks:
      fork_net:
        ipv4_address: '172.13.0.3'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8545 || exit 1"]
      interval: 5s
      timeout: 30s
      retries: 10
    volumes:
      - erigon-data:/erigon-data
    ports:
      - 8545:8545

  postgres:
    image: postgres:17
    container_name: mev-commit-postgres
    environment:
      POSTGRES_DB: mevcommit
      POSTGRES_USER: mevcommit
      POSTGRES_PASSWORD: password123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      fork_net:
        ipv4_address: '172.13.0.4'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mevcommit -d mevcommit"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: >
      postgres

  cons-node:
    build:
      context: .
      dockerfile: Dockerfile.snode
    networks:
      fork_net:
        ipv4_address: '172.13.0.5'
    depends_on:
      postgres:
        condition: service_healthy
      erigon:
        condition: service_healthy

  erigon-follower:
    build:
      context: .
      dockerfile: Dockerfile.erigon
    networks:
      fork_net:
        ipv4_address: '172.13.0.6'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8545 || exit 1"]
      interval: 5s
      timeout: 30s
      retries: 10
    volumes:
      - erigon-follower-data:/erigon-data
    ports:
      - 8546:8545

  follower-cl:
    build:
      context: .
      dockerfile: Dockerfile.follower
    networks:
      fork_net:
        ipv4_address: '172.13.0.7'
    depends_on:
      postgres:
        condition: service_healthy
      erigon-follower:
        condition: service_healthy

networks:
  fork_net:
    driver: bridge
    ipam:
      driver: default
      config:
      - subnet: 172.13.0.0/16

volumes:
  erigon-data:
  erigon-follower-data:
  postgres_data:
  pgadmin_data:
